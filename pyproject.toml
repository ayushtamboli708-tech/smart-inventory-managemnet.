[project]
name = "stockwise"
version = "2.1.0"
description = "Stockwise inventory, POS, procurement, and demand forecasting"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.54.0",
    "pandas==2.3.3",
    "numpy==2.4.2",
    "mysql-connector-python==9.6.0",
    "plotly==6.5.2",
    "statsmodels==0.14.6",
    "holidays==0.92",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
